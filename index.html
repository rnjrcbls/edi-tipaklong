<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>missyu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('bg.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Playfair Display', serif;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        img {
            width: 50%;
            height: auto;
            background: transparent;
            mix-blend-mode: screen;
        }

        p {
            color: aqua;
            text-align: center;
            font-weight: 900;
            font-size: 2rem;
            margin: 5px 0;
        }

        #continueBtn {
            margin-top: 25px;
            padding: 12px 35px;

            border: 2px solid aqua;
            border-radius: 30px;

            background: transparent;
            color: aqua;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        #continueBtn:hover {
            background: aqua;
            color: black;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            img {
                width: 85%;
            }

            p {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="content">

        <img src="2.gif" alt="This is a photo">
       
        <br><br>

        <p>I</p>
        <p>M I S S</p>
        <p>Y O U</p>
        <p>S O</p>
        <p>M U C H</p>
        <p>B A B Y</p>

        <button id="continueBtn" onclick="startExperience()">
            Continue
        </button>

    </div>

    <!-- Background Music -->
             <audio id="backgroundMusic" loop>
            <source src="miss.mp3" type="audio/mpeg">
          </audio>

            alert("What if?");
            alert("Paano kung bigla kitang mayakap?");

            alert("Paano kung hawak ko ang kamay mo habang naglalakad tayo?");

            music.play().catch(() => {

</body>
</html>
